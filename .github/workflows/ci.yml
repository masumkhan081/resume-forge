name: CI

on:
  pull_request:
  push:
    branches: [main, master]

env:
  NEXT_PUBLIC_BASE_URL: http://localhost:3000
  MONGODB_URI: mongodb://placeholder:placeholder@localhost:27017
  MONGODB_DB_NAME: resume-forge
  AUTH_SECRET: ci-placeholder-auth-secret-32-chars-long
  AUTH_TRUST_HOST: 'true'

jobs:
  check:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
